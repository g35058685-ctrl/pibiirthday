  }
}

/* ---- Gift 4: full-screen flower burst ---- */
const flowerBurstField = $('flowerBurstField');
const FLOWER_IMAGES = ['l1.jpg', 'l2.jpg', 'l3.jpg'];
let flowerAmbientInterval = null;

function spawnFlowerBurst(count = 24, opts = {}){
  if(!flowerBurstField) return;
  const vw = window.innerWidth;
  const spread = opts.spread !== false;
  const maxDelay = opts.maxDelay !== undefined ? opts.maxDelay : 0.7;
  const minDur = opts.minDur !== undefined ? opts.minDur : 2.3;
  const durRange = opts.durRange !== undefined ? opts.durRange : 2.3;
  const col = vw / count;
  for(let i = 0; i < count; i++){
    const el = document.createElement('img');
    el.className = 'flower-petal';
    el.src = FLOWER_IMAGES[Math.floor(Math.random() * FLOWER_IMAGES.length)];
    el.alt = '';
    const size = 40 + Math.random() * 72;
    const dur = minDur + Math.random() * durRange;
    const delay = Math.random() * maxDelay;
    const sway = (Math.random() - 0.5) * 190;
    const rot = (Math.random() - 0.5) * 180;
    // evenly distribute across the width (with jitter, columns narrower than the flowers) so petals sit shoulder-to-shoulder
    const x = spread ? (col * i + Math.random() * col) : Math.random() * vw;
    el.style.left = `${x}px`;
    el.style.width = `${size}px`;
    el.style.animationDuration = `${dur}s`;
    el.style.animationDelay = `${delay}s`;
    el.style.setProperty('--sway', `${sway}px`);
    el.style.setProperty('--rot', `${rot}deg`);
    flowerBurstField.appendChild(el);
    el.addEventListener('animationend', () => el.remove(), { once: true });
  }
}

function startFlowerAmbience(){
  stopFlowerAmbience();
  flowerAmbientInterval = setInterval(() => spawnFlowerBurst(10, { spread:false, maxDelay:0.3 }), 1100);
}

function stopFlowerAmbience(){
  if(flowerAmbientInterval){
    clearInterval(flowerAmbientInterval);
    flowerAmbientInterval = null;
  }
}

function spawnHeartBurst(bounds){
  const count = 12;
  const field = document.body;
  for(let i=0;i<count;i++){
    const p = document.createElement('span');
    p.className = 'heart-burst-particle';
    p.textContent = '♥';
    const bx = (Math.random()-0.5) * 220;
    const by = (Math.random()-0.6) * -220;
    const bs = 0.8 + Math.random() * 0.8;
    const br = (Math.random() - 0.5) * 180;
    p.style.left = `${bounds.left + bounds.width * 0.5}px`;
    p.style.top = `${bounds.top + bounds.height * 0.5}px`;
    p.style.setProperty('--bx', `${bx}px`);
    p.style.setProperty('--by', `${by}px`);
    p.style.setProperty('--bs', bs);
    p.style.setProperty('--br', `${br}deg`);
    field.appendChild(p);
    p.addEventListener('animationend', () => p.remove(), { once: true });
  }
}

function spawnGiftConfetti(){
  const field = $('giftConfettiField');
  if(!field) return;
  field.innerHTML = '';
  const fieldWidth = field.clientWidth || window.innerWidth;
  const colors = ['#ff5d84','#ffb8cd','#ffe1ea','#f0cf8e','#f0cf8e','#c22458','#ffc85a','#d3b68c'];
  const count = 32;
  for(let i=0;i<count;i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-fall-piece';
    const x = Math.random() * fieldWidth;
    const fx = (Math.random() - 0.5) * 160;
    const frot = 360 + Math.random() * 720;
    const size = 6 + Math.random() * 8;
    piece.style.left = `${x}px`;
    piece.style.width = piece.style.height = `${size}px`;
    piece.style.background = colors[Math.floor(Math.random()*colors.length)];
    piece.style.setProperty('--fx', `${fx}px`);
    piece.style.setProperty('--frot', `${frot}deg`);
    piece.style.animationDelay = `${Math.random() * 0.2}s`;
    piece.style.animationDuration = `${1.4 + Math.random() * 0.8}s`;
    field.appendChild(piece);
    piece.addEventListener('animationend', () => piece.remove(), { once: true });
  }
}

function openGiftCard(index = 0, bounds = null){
  setGiftCardContent(index);
  if (giftCardOverlay && giftCardOverlay.querySelector('.gift-card')) {
    giftCardOverlay.querySelector('.gift-card').scrollTop = 0;
  }
  if(bounds){
    spawnHeartBurst(bounds);
    spawnGiftConfetti();
    setTimeout(()=> giftCardOverlay.classList.add('revealed'), 180);
  } else {
    giftCardOverlay.classList.add('revealed');
  }
}

function closeGiftCard(){
  giftCardOverlay.classList.remove('revealed');
  giftBoxes.forEach(box => box.classList.remove('opening'));
  if(typeof window.bqStop === 'function') window.bqStop();
  if(giftVideoPlayer){
    giftVideoPlayer.pause();
  }
  if(birthdayAudio && birthdayAudio.dataset.wasPlayingBeforeGiftVideo === '1'){
    birthdayAudio.dataset.wasPlayingBeforeGiftVideo = '';
    birthdayAudio.play().catch(()=>{});
  }
  stopFlowerAmbience();
}

const envelopeOverlay = $('envelopeOverlay');
const envelopeWrap = $('envelopeWrap');
const envelopeLetterOverlay = $('envelopeLetterOverlay');
const envelopeLetterClose = $('envelopeLetterClose');
const envLetterTitle = $('envLetterTitle');
const envLetterMessage = $('envLetterMessage');

function showCuteEnvelope(){
  envelopeWrap.classList.remove('opening');
  envelopeOverlay.classList.remove('envelope-hidden');
  envelopeOverlay.classList.add('open');
  // flowers keep drifting gently in the background instead of a dense full-screen rise
  startFlowerAmbience();
}

function openEnvelopeLetter(){
  if(envelopeWrap.classList.contains('opening')) return; // already opening/open
  envelopeWrap.classList.add('opening');
  // let the flap finish swinging open, then swap the envelope for the letter card
  setTimeout(() => {
    envelopeOverlay.classList.add('envelope-hidden');
    const story = giftStories[3];
    if(envLetterTitle) envLetterTitle.textContent = story.title;
    if(envLetterMessage) envLetterMessage.innerHTML = story.message;
    envelopeLetterOverlay.classList.add('open');
  }, 620);
}

function closeEnvelopeSequence(){
  envelopeLetterOverlay.classList.remove('open');
  envelopeOverlay.classList.remove('open', 'envelope-hidden');
  envelopeWrap.classList.remove('opening');
  giftBoxes.forEach(box => box.classList.remove('opening'));
  stopFlowerAmbience();
}

function handleGiftBoxOpen(box, index){
  giftBoxes.forEach(b => b.classList.remove('opening'));
  box.classList.add('opening');

  if(index === 3){
    // Gift 4: screen fills punong-puno (dikit-dikit) with flowers in dense waves,
    // and only once they've all finished rising does the scroll animate in.
    // (Background song keeps playing, same as gifts 1 and 2.)
    const waveOpts = { maxDelay:0.35, minDur:2.1, durRange:1.5 }; // flowers finish rising within ~3.6s of their own spawn
    const waves = [
      { count:65, at:0 },
      { count:60, at:150 },
      { count:60, at:300 },
      { count:55, at:450 },
    ];
    waves.forEach(w => setTimeout(() => spawnFlowerBurst(w.count, waveOpts), w.at));

    const lastWaveAt = waves[waves.length - 1].at;
    const riseFinishBy = lastWaveAt + (waveOpts.maxDelay * 1000) + ((waveOpts.minDur + waveOpts.durRange) * 1000);
    setTimeout(() => showCuteEnvelope(), riseFinishBy + 250);
  } else {
    openGiftCard(index, box.getBoundingClientRect());
  }
}

giftBoxes.forEach((box, index) => {
  box.dataset.giftIndex = index;
  box.addEventListener('click', () => handleGiftBoxOpen(box, index));
  box.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      handleGiftBoxOpen(box, index);
    }
  });
});

envelopeWrap.addEventListener('click', openEnvelopeLetter);
envelopeWrap.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' || e.key === ' '){
    e.preventDefault();
    openEnvelopeLetter();
  }
});
envelopeLetterClose.addEventListener('click', closeEnvelopeSequence);
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape' && envelopeLetterOverlay.classList.contains('open')) closeEnvelopeSequence();
});

giftCardCta.addEventListener('click', closeGiftCard);
giftCardOverlay.addEventListener('click', (e) => {
  if(e.target === giftCardOverlay) closeGiftCard();
});

if(giftVideoPlayer){
  giftVideoPlayer.addEventListener('play', () => {
    if(birthdayAudio && !birthdayAudio.paused){
      birthdayAudio.dataset.wasPlayingBeforeGiftVideo = '1';
      birthdayAudio.pause();

    if(giftCardVideoWrap) giftCardVideoWrap.classList.add('spinning');

    if(giftCardVideoWrap) giftCardVideoWrap.classList.remove('spinning');
  });
  giftVideoPlayer.addEventListener('ended', () => {
    if(giftCardVideoWrap) giftCardVideoWrap.classList.remove('spinning');
  });
}

/* ========================================================================
   HEART CURSOR TRAIL — little hearts drifting off the pointer on desktop
   ======================================================================== */
(function(){
  const isFinePointer = window.matchMedia && window.matchMedia('(pointer: fine)').matches;
  if(!isFinePointer) return;

  const glyphs = ['♥','♡','✦','✧','✨','💫','💖','⋆'];
  const palette = ['#ff5d84','#ef3f6d','#ffb8cd','#f0cf8e','#c22458','#ffe1ea'];
  let lastSpawn = 0;
  let moveCount = 0;
  const minGap = 65; // ms between spawns

  const glowOrb = document.createElement('div');
  glowOrb.className = 'cursor-glow-orb';
  document.body.appendChild(glowOrb);

  function spawnParticle(x, y, opts = {}){
    const heart = document.createElement('span');
    heart.className = 'cursor-heart-trail';
    heart.textContent = opts.glyph || glyphs[Math.floor(Math.random()*glyphs.length)];
    heart.style.left = x + 'px';
    heart.style.top = y + 'px';
    const spread = opts.spread || 26;
    heart.style.setProperty('--tx', ((Math.random()-0.5)*spread*2)+'px');
    heart.style.setProperty('--ty', (-(opts.lift || (18+Math.random()*28)))+'px');
    heart.style.setProperty('--tr', ((Math.random()-0.5)*80)+'deg');
    heart.style.fontSize = (opts.size || (11+Math.random()*10))+'px';
    const color = opts.color || palette[Math.floor(Math.random()*palette.length)];
    heart.style.color = color;
    heart.style.textShadow = `0 0 8px ${color}aa, 0 0 18px ${color}66`;
    document.body.appendChild(heart);
    heart.addEventListener('animationend', ()=> heart.remove(), { once:true });
  }

  window.addEventListener('pointermove', (e)=>{
    glowOrb.style.left = e.clientX + 'px';
    glowOrb.style.top = e.clientY + 'px';

    const now = performance.now();
    if(now - lastSpawn < minGap) return;
    lastSpawn = now;
    moveCount++;

    spawnParticle(e.clientX, e.clientY);

    // every so often, a little glam sparkle burst instead of a single trail dot     
    if(moveCount % 8 === 0){
      const burstCount = 2 + Math.floor(Math.random()*2);
      for(let i=0;i<burstCount;i++){
        spawnParticle(
          e.clientX + (Math.random()-0.5)*18,
          e.clientY + (Math.random()-0.5)*18,
          { spread:42, lift:30+Math.random()*22, size:14+Math.random()*9, glyph:'✨' }
        );
      }    }
  }, { passive:true });

  window.addEventListener('pointerdown', (e)=>{
    for(let i=0;i<7;i++){
      spawnParticle(e.clientX, e.clientY, {
        spread:48,
        lift:34 + Math.random()*28,
        size:14 + Math.random()*10
      });
    }
  }, { passive:true });
})();
